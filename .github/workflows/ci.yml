name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Go formatting
        run: |
          # date.go is not gofmt-clean in upstream v1.2.1 (the
          # upstream tree predates the Go 1.19 comment
          # reformatting). It is left untouched to keep the
          # fork's diff against upstream minimal. Every other
          # file must be gofmt-clean.
          UNFORMATTED=$(gofmt -l . | grep -v '^date.go$' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
