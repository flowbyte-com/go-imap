name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Go formatting
        run: |
          # The upstream sources are not gofmt-clean; only the
          # files this fork modified are checked.
          FILES="read.go read_test.go client/client.go client/client_test.go"
          UNFORMATTED=$(gofmt -l $FILES)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
